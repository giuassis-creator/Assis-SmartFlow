# Isolated runtime tests: no published ports, provider service or Internet route.
# Only the existing local model cache is reused, read-only.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: assis_e2e
      POSTGRES_USER: assis_e2e
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?test runner required}
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U assis_e2e -d assis_e2e']
      interval: 2s
      retries: 30
    networks: [isolated]
  n8n:
    image: n8nio/n8n:2.37.7
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: assis_e2e
      DB_POSTGRESDB_USER: assis_e2e
      DB_POSTGRESDB_PASSWORD: ${E2E_DB_PASSWORD:?test runner required}
      # Nested webhook executions share n8n's own database connection pool.
      DB_POSTGRESDB_POOL_SIZE: '10'
      N8N_ENCRYPTION_KEY: ${E2E_ENCRYPTION_KEY:?test runner required}
      N8N_SECURE_COOKIE: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_RUNNERS_TASK_TIMEOUT: '300'
    depends_on:
      postgres: {condition: service_healthy}
    networks: [isolated]
  qdrant:
    image: qdrant/qdrant:v1.15.1
    networks: [isolated]
  ollama:
    image: ollama/ollama:0.33.3
    environment:
      OLLAMA_MODELS: /model-cache/models
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - model_cache:/model-cache:ro
    networks: [isolated]
  qa:
    build:
      context: ./qa
    image: assis-smartflow-qa:latest
    environment:
      ASSIS_E2E_SIMULATED: '1'
      INTERNAL_AGENT_TOKEN: ${E2E_INTERNAL_TOKEN:?test runner required}
      WAHA_WEBHOOK_SECRET: ${E2E_WEBHOOK_SECRET:?test runner required}
      N8N_INTERNAL_URL: http://n8n:5678
      POSTGRES_HOST: postgres
      POSTGRES_DB: assis_e2e
      POSTGRES_USER: assis_e2e
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?test runner required}
    volumes:
      - ..:/workspace:ro
    working_dir: /workspace
    networks: [isolated]
networks:
  isolated:
    internal: true
volumes:
  model_cache:
    external: true
    name: ${E2E_MODEL_VOLUME:-assis-smartflow_ollama_data}
