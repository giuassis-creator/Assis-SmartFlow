name: assis-smartflow
services:
  postgres:
    image: pgvector/pgvector:pg${POSTGRES_VERSION:-16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    restart: unless-stopped
    command: ["sh","-c","exec redis-server --appendonly yes --requirepass '$$REDIS_PASSWORD'"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.15.1}
    restart: unless-stopped
    volumes: ["qdrant_data:/qdrant/storage"]
    networks: [backend]
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.37.7}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      N8N_PERSONALIZATION_ENABLED: ${N8N_PERSONALIZATION_ENABLED:-false}
      EXECUTIONS_DATA_PRUNE: ${EXECUTIONS_DATA_PRUNE:-true}
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
      ORG_NAME: ${ORG_NAME:-Minha Empresa}
      SECRETARY_NAME: ${SECRETARY_NAME:-Maya}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: ["n8n_data:/home/node/.n8n"]
    networks: [frontend, backend]
  caddy:
    image: caddy:${CADDY_VERSION:-2.10-alpine}
    restart: unless-stopped
    depends_on: [n8n]
    environment:
      ASSIS_DOMAIN: ${ASSIS_DOMAIN:-assis.localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]
networks:
  frontend: {}
  backend:
    internal: true
volumes:
  postgres_data: {}
  redis_data: {}
  qdrant_data: {}
  n8n_data: {}
  caddy_data: {}
  caddy_config: {}
