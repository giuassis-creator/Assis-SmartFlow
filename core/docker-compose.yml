name: assis-smartflow
services:
  postgres:
    image: pgvector/pgvector:pg${POSTGRES_VERSION:-16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    restart: unless-stopped
    command: ["sh","-c","exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.15.1}
    restart: unless-stopped
    volumes: ["qdrant_data:/qdrant/storage"]
    networks: [backend]

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.37.7}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      N8N_PERSONALIZATION_ENABLED: ${N8N_PERSONALIZATION_ENABLED:-false}
      EXECUTIONS_DATA_PRUNE: ${EXECUTIONS_DATA_PRUNE:-true}
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
      ORG_NAME: ${ORG_NAME:-Minha Empresa}
      SECRETARY_NAME: ${SECRETARY_NAME:-Maya}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b-instruct}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      STT_BASE_URL: ${STT_BASE_URL:-http://stt:8000}
      TTS_BASE_URL: ${TTS_BASE_URL:-http://tts:7860}
      TTS_VOICE: ${TTS_VOICE:-pf_dora}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_ALLOW_PAID_FALLBACK: ${AI_ALLOW_PAID_FALLBACK:-false}
      INTERNAL_AGENT_TOKEN: ${INTERNAL_AGENT_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../library:/opt/assis/library:ro
      - ../starter:/opt/assis/starter:ro
      - ../professional:/opt/assis/professional:ro
      - ../enterprise:/opt/assis/enterprise:ro
      - ../mcp:/opt/assis/mcp:ro
    networks: [frontend, backend]

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.33.3}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks: [backend, ai_egress]

  ollama-init:
    image: ollama/ollama:${OLLAMA_VERSION:-0.33.3}
    restart: "no"
    depends_on:
      ollama: {condition: service_healthy}
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b-instruct}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        ollama pull "$$OLLAMA_CHAT_MODEL"
        ollama pull "$$OLLAMA_EMBED_MODEL"
    networks: [backend]

  stt:
    build:
      context: ./ai/stt
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - whisper_cache:/root/.cache/huggingface
    networks: [backend, ai_egress]

  tts:
    image: hangrylabs/kokorotts:${KOKORO_VERSION:-v0.2}
    restart: unless-stopped
    volumes:
      - kokoro_cache:/root/.cache/huggingface
    networks: [backend]

  qa:
    build:
      context: ./qa
    profiles: ["tools"]
    volumes:
      - ..:/workspace:ro
    working_dir: /workspace
    networks: [backend]

  caddy:
    image: caddy:${CADDY_VERSION:-2.10-alpine}
    restart: unless-stopped
    depends_on: [n8n]
    environment:
      ASSIS_DOMAIN: ${ASSIS_DOMAIN:-assis.localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]

networks:
  frontend: {}
  backend:
    internal: true
  ai_egress: {}
volumes:
  postgres_data: {}
  redis_data: {}
  qdrant_data: {}
  n8n_data: {}
  caddy_data: {}
  caddy_config: {}
  ollama_data: {}
  whisper_cache: {}
  kokoro_cache: {}
