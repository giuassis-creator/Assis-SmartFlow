name: assis-smartflow
services:
  postgres:
    image: pgvector/pgvector:pg${POSTGRES_VERSION:-16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    restart: unless-stopped
    command: ["sh","-c","exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.15.1}
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [backend]

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.37.7}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-${WEBHOOK_URL}}
      WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      N8N_PERSONALIZATION_ENABLED: ${N8N_PERSONALIZATION_ENABLED:-false}
      N8N_UNVERIFIED_PACKAGES_ENABLED: ${N8N_UNVERIFIED_PACKAGES_ENABLED:-false}
      N8N_RUNNERS_TASK_TIMEOUT: ${N8N_RUNNERS_TASK_TIMEOUT:-300}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-true}
      EXECUTIONS_DATA_PRUNE: ${EXECUTIONS_DATA_PRUNE:-true}
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
      ORG_NAME: ${ORG_NAME:-Minha Empresa}
      SECRETARY_NAME: ${SECRETARY_NAME:-Maya}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b-instruct}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      STT_BASE_URL: ${STT_BASE_URL:-http://stt:8000}
      TTS_BASE_URL: ${TTS_BASE_URL:-http://tts:7860}
      TTS_VOICE: ${TTS_VOICE:-pf_dora}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_ALLOW_PAID_FALLBACK: ${AI_ALLOW_PAID_FALLBACK:-false}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../library:/opt/assis/library:ro
      - ../starter:/opt/assis/starter:ro
      - ../professional:/opt/assis/professional:ro
      - ../enterprise:/opt/assis/enterprise:ro
      - ../mcp:/opt/assis/mcp:ro
    networks: [frontend, backend]

  waha:
    image: devlikeapro/waha:${WAHA_VERSION:-2026.8.2}
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_API_KEY_PLAIN: ${WAHA_API_KEY:-}
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_ENGINE:-GOWS}
      WAHA_NAMESPACE: all
      WAHA_DASHBOARD_ENABLED: ${WAHA_DASHBOARD_ENABLED:-true}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-}
      WHATSAPP_SWAGGER_ENABLED: ${WAHA_SWAGGER_ENABLED:-false}
      WAHA_LOG_FORMAT: JSON
      WAHA_LOG_LEVEL: ${WAHA_LOG_LEVEL:-info}
      WAHA_PRINT_QR: ${WAHA_PRINT_QR:-false}
      WHATSAPP_HOOK_URL: http://n8n:5678/webhook/adapter/waha/in
      WHATSAPP_HOOK_EVENTS: session.status,message
      WHATSAPP_HOOK_CUSTOM_HEADERS: X-Assis-Secret:${WAHA_WEBHOOK_SECRET:-}
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: ${WAHA_WEBHOOK_RETRIES:-4}
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/sessions',{headers:{'X-Api-Key':process.env.WAHA_API_KEY}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" ]
      interval: 15s
      timeout: 8s
      retries: 20
    networks: [backend, ai_egress]

  provider-gateway:
    build:
      context: ./provider-gateway
    restart: unless-stopped
    depends_on:
      n8n: {condition: service_started}
    environment:
      N8N_INTERNAL_URL: http://n8n:5678
      WHATSAPP_PROVIDER_DEFAULT: ${WHATSAPP_PROVIDER_DEFAULT:-waha}
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      EVOLUTION_SENDTEXT_PAYLOAD_STYLE: ${EVOLUTION_SENDTEXT_PAYLOAD_STYLE:-modern}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend, ai_egress]

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.33.3}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks: [backend, ai_egress]

  ollama-init:
    image: ollama/ollama:${OLLAMA_VERSION:-0.33.3}
    restart: "no"
    depends_on:
      ollama: {condition: service_healthy}
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b-instruct}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        ollama pull "$$OLLAMA_CHAT_MODEL"
        ollama pull "$$OLLAMA_EMBED_MODEL"
    networks: [backend]

  stt:
    build:
      context: ./ai/stt
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - whisper_cache:/root/.cache/huggingface
    networks: [backend, ai_egress]

  tts:
    image: hangrylabs/kokorotts:${KOKORO_VERSION:-v0.2}
    restart: unless-stopped
    volumes:
      - kokoro_cache:/root/.cache/huggingface
    networks: [backend]

  qa:
    build:
      context: ./qa
    profiles: ["tools"]
    environment:
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b-instruct}
      TTS_VOICE: ${TTS_VOICE:-pf_dora}
      INTERNAL_AGENT_TOKEN: ${INTERNAL_AGENT_TOKEN}
      N8N_INTERNAL_URL: http://n8n:5678
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ..:/workspace:ro
    working_dir: /workspace
    networks: [backend]

  caddy:
    image: caddy:${CADDY_VERSION:-2.10-alpine}
    restart: unless-stopped
    depends_on: [n8n]
    environment:
      ASSIS_DOMAIN: ${ASSIS_DOMAIN:-assis.localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]

networks:
  frontend: {}
  backend:
    internal: true
  ai_egress: {}
volumes:
  postgres_data: {}
  redis_data: {}
  qdrant_data: {}
  n8n_data: {}
  caddy_data: {}
  caddy_config: {}
  ollama_data: {}
  whisper_cache: {}
  kokoro_cache: {}
  waha_sessions: {}
  waha_media: {}
